[project]
name = "wherestheremote"
version = "0.1.0"
description = "Locate the Apple TV remote in the living room with a Tapo camera and a BLE motion tag"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "python-dotenv",
    "ultralytics",
    "onnx",
    "onnxruntime",
    "openvino",
    "rtmlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wtr"]
